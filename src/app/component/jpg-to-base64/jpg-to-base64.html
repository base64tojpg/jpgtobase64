<section class="converter">
  <header class="converter-header">
    <h1 class="title">Convert <span class="highlight">JPG</span> to Base64</h1>
    <p class="subtitle">Drop your image below — it never leaves your device.</p>
  </header>

  <div
    class="dropzone"
    [class.dropzone--active]="isDragging"
    [class.dropzone--has-file]="dataUrl"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <div class="dropzone-content" *ngIf="!dataUrl">
      <div class="dropzone-icon">
        <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L8 8m4-4l4 4M4 14v4a2 2 0 002 2h12a2 2 0 002-2v-4"/>
        </svg>
      </div>
      <p class="dropzone-text">Drag & drop a JPG here</p>
      <span class="dropzone-or">or</span>
      <label class="btn btn--primary">
        <span>Browse Files</span>
        <input
          #fileInput
          type="file"
          accept=".jpg,.jpeg,image/jpeg"
          (change)="onFileSelected($event)"
          hidden
        />
      </label>
    </div>

    <div class="dropzone-preview" *ngIf="dataUrl">
      <img [src]="dataUrl" alt="Preview" />
      <button class="btn-clear" type="button" (click)="clear()" aria-label="Remove image">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="status" *ngIf="isLoading">
    <span class="spinner"></span>
    <span>Processing…</span>
  </div>

  <div class="status status--error" *ngIf="error">
    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <path stroke-linecap="round" d="M12 8v4m0 4h.01"/>
    </svg>
    <span>{{ error }}</span>
  </div>

  <div class="result" *ngIf="dataUrl && base64Only">
    <div class="result-meta">
      <div class="meta-item">
        <span class="meta-label">File</span>
        <span class="meta-value">{{ fileName }}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">Size</span>
        <span class="meta-value">{{ base64Only.length | number }} chars</span>
      </div>
    </div>

    <div class="result-actions">
      <button class="btn btn--primary" type="button" (click)="copy(base64Only)">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15V5a2 2 0 012-2h10"/>
        </svg>
        Copy Base64
      </button>
      <button class="btn btn--secondary" type="button" (click)="copy(dataUrl)">Copy Data URL</button>
      <button class="btn btn--secondary" type="button" (click)="downloadBase64()">Download .txt</button>
    </div>

    <div class="result-output">
      <div class="output-tabs">
        <button
          class="tab"
          [class.tab--active]="activeTab === 'base64'"
          (click)="activeTab = 'base64'"
        >Base64 only</button>
        <button
          class="tab"
          [class.tab--active]="activeTab === 'dataurl'"
          (click)="activeTab = 'dataurl'"
        >Full Data URL</button>
      </div>
      <textarea
        class="output-textarea"
        readonly
        [value]="activeTab === 'base64' ? base64Only : dataUrl"
      ></textarea>
    </div>
  </div>
</section>
